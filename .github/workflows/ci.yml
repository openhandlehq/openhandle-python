name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            UV_NO_SYNC: '1'
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v7
              with:
                  python-version: '3.12'
            - run: uv sync --frozen
            - run: uv run python scripts/generate.py --check
            - run: uv run ruff check .
            - run: uv run ruff format --check .
            - run: uv run mypy
            - run: uv run pytest
            - run: uv run python scripts/score_agent_eval.py evals/reference
            - run: uv build
